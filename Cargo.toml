[package]
name = "inroom"
version = "0.2.0"
edition = "2021"
description = "CTA-2034 spatial averages against simulated listening rooms, and loudspeakers with Linkwitz-Riley or brickwall crossovers"
license = "MIT"
repository = "https://github.com/Arnwald/cta2034-room-study"

[dependencies]
bincode = { version = "2", features = ["serde"] }
libm = "0.2"
num-complex = { version = "0.4", features = ["serde"] }
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "line_series", "point_series", "area_series"] }
rayon = "1.12"
resvg = "0.45"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
svg2pdf = "0.13"
ttf-parser = "0.25"
usvg = "0.45"

[profile.release]
opt-level = 3
debug = false

[profile.test]
opt-level = 3
